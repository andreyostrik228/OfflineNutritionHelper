<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<!-- La imagen de compartir el enlace (og:image, 1200×630) del gato cocinero,
     2026-10-31. Sale a assets/img/og-gato.png con exportar.mjs. Para cambiar
     la frase, basta el texto del bocadillo; si cambia el tamaño, también
     og:image:width/height en index.html. -->
<style>
  @font-face { font-family: "Nunito"; font-weight: 400 900; src: url("../../assets/fonts/nunito-normal-latin-798ec6.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: "Nunito"; font-weight: 400 900; src: url("../../assets/fonts/nunito-normal-latin-ext-012b61.woff2") format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Nunito"; font-weight: 400 900; src: url("../../assets/fonts/nunito-normal-cyrillic-373a90.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  html, body { margin: 0; }
  .og { position: relative; box-sizing: border-box; width: 1200px; height: 630px; overflow: hidden; padding: 64px 72px; background: #ffd23f; color: #1f1a10; }
  /* z-index: el gato es gato.svg entero, con su cuadrado amarillo, y sin esto
     tapa el borde derecho del bocadillo. */
  .bocadillo { position: relative; z-index: 1; box-sizing: border-box; width: 600px; margin-top: 36px; padding: 34px 40px; border: 6px solid #2b2b2b; border-radius: 40px; background: #fff; font: 900 66px/1.02 "Nunito", sans-serif; }
  .bocadillo::before { content: ""; position: absolute; right: -46px; top: 92px; border-style: solid; border-width: 26px 0 26px 46px; border-color: transparent transparent transparent #2b2b2b; }
  .bocadillo::after { content: ""; position: absolute; right: -34px; top: 100px; border-style: solid; border-width: 18px 0 18px 34px; border-color: transparent transparent transparent #fff; }
  .firma { position: absolute; left: 72px; bottom: 54px; display: flex; align-items: center; gap: 14px; font: 900 34px/1 "Nunito", sans-serif; }
  .firma img { width: 56px; height: 56px; border-radius: 15px; }
  .firma small { display: block; margin-top: 4px; font: 700 21px/1 "Nunito", sans-serif; color: #5a4a10; }
  .gato { position: absolute; right: -10px; top: 120px; width: 560px; height: 560px; }
</style>
</head>
<body>
<div class="og">
  <div class="bocadillo">Tú cocinas.<br>Yo hago las cuentas.</div>
  <div class="firma"><img src="gato.svg" alt=""><span>Weekplate<small>Menús con precios reales</small></span></div>
  <img class="gato" src="gato.svg" alt="">
</div>
</body>
</html>
