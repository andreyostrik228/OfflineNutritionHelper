<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>Esta p&aacute;gina no existe &mdash; Nutrition Planner</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f1e5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
  <!-- Sin la hoja de estilos del sitio a proposito: una pagina de error tiene
       que salir aunque el CSS no cargue, y son veinte lineas. -->
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem;
      font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f7f1e5; color: #211a14;
    }
    main { max-width: 30rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
    p { line-height: 1.55; margin: 0 0 1rem; color: #5c5045; }
    a {
      display: inline-block; margin-top: .5rem; padding: .7rem 1.1rem;
      background: #1c5c40; color: #fff; text-decoration: none;
      border-radius: 999px; font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #17130f; color: #f2ece2; }
      p { color: #cabfb1; }
      a { background: #7bbf95; color: #10231a; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Esta p&aacute;gina no existe</h1>
    <p>
      El enlace que has seguido no lleva a ninguna parte. No has perdido
      nada: tus datos y tus planes se guardan en tu propio navegador.
    </p>
    <a href="/">Volver al planificador</a>
  </main>
</body>
</html>
