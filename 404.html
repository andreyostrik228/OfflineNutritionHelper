<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>Esta p&aacute;gina no existe &mdash; Nutrition Planner</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#edeff3">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icon-32.png">
  <!-- Sin la hoja de estilos del sitio a proposito: una pagina de error tiene
       que salir aunque el CSS no cargue, y son veinte lineas. -->
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #edeff3; color: #0f1115;
    }
    main { max-width: 30rem; }
    h1 {
      font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      font-size: 2.4rem; line-height: 1; margin: 0 0 .75rem;
      text-transform: uppercase; letter-spacing: .01em;
    }
    p { line-height: 1.55; margin: 0 0 1rem; color: #444b57; }
    a {
      display: inline-block; margin-top: .5rem; padding: .8rem 1.4rem;
      background: #0f1115; color: #cbff3c; text-decoration: none;
      border-radius: 999px; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase;
    }
    a:focus-visible { outline: 3px solid #0f1115; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Esta p&aacute;gina no existe</h1>
    <p>
      El enlace que has seguido no lleva a ninguna parte. No has perdido
      nada: tus datos y tus planes se guardan en tu propio navegador.
    </p>
    <a href="/">Volver al planificador</a>
  </main>
</body>
</html>
